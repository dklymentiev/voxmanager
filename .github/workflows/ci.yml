name: CI

# CONTRIBUTING asks every pull request to run the tests, and packaging/release.ps1
# refuses to build when they are red. This runs them for you on both.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    # Windows: the server's verified platform, and pynput imports headless here.
    # (On a Linux runner it needs an X display, so the suite would fail on import.)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime dependencies
        run: pip install -r server/requirements.txt
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  android-build:
    # Compiles the app. It does not run instrumented tests (there are none yet);
    # the point is that a Kotlin change that does not build cannot reach main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
